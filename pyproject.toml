[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtree-books"
version = "0.1.0"
description = "Book saleability classification pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]